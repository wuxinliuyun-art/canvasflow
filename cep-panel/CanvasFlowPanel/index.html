<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CanvasFlow 互传</title>
<style>
  /* 设计基调：OLED 深色工具面板（ui-ux-pro-max Dark Mode 方向）
     贴近 Photoshop 自身 UI 灰，品牌蓝沿用 CanvasFlow 主色，紧凑单列布局 */
  :root {
    --bg: #212121;          /* 面板底，与 PS UI 融合 */
    --card: #2b2b2f;
    --line: #3d3d42;
    --text: #e6e6e8;
    --muted: #9a9aa2;
    --accent: #4f7cff;
    --accent-hover: #3d6bf0;
    --ok: #4cc38a;
    --err: #f0787a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 12px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; min-height: calc(100vh - 18px); }

  /* 顶部状态区：PS 连接点 + 文档信息 + 画布连接点 + 面板版本号 */
  .head { display: flex; align-items: center; gap: 6px; }
  .head .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .head .dot.ok { background: var(--ok); }
  .head .dot.err { background: var(--err); }
  .head .doc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .head .doc strong { color: var(--text); font-weight: 600; }
  .head .ver { flex: 0 0 auto; color: var(--muted); font-size: 11px; }

  /* 可选的画布地址：弱化为单行小输入 */
  .field { display: none; }
  .field label { display: block; margin: 0 0 3px; color: var(--muted); font-size: 11px; }
  .field input { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 12px; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  body.show-field .field { display: block; }

  /* 主操作：两个全宽 40px 按钮，SVG 图标 + 文案 */
  .actions { display: flex; flex-direction: column; gap: 6px; }
  button { display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; min-height: 40px; padding: 0 10px; border-radius: 8px;
    font: 600 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif; cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  #sendAllBtn { border: 0; background: var(--accent); color: #fff; }
  #sendAllBtn:hover:not(:disabled) { background: var(--accent-hover); }
  #sendLayerBtn { border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #sendLayerBtn:hover:not(:disabled) { border-color: var(--muted); }
  button svg { width: 15px; height: 15px; flex: 0 0 auto; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }

  /* 日志：贴底固定高度，等宽小字 */
  #log { flex: 1; min-height: 64px; max-height: 200px; overflow-y: auto;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font: 11px/1.6 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-all; }
  #log:empty::before { content: "日志"; color: var(--muted); }
  #log .ok { color: var(--ok); }
  #log .err { color: var(--err); }
  #log .muted { color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <span class="dot" id="statusDot" title="Photoshop 连接状态"></span>
    <span class="doc" id="docLine">正在连接 Photoshop…</span>
    <span class="dot" id="canvasDot" title="画布连接状态"></span>
    <span class="ver" id="panelVersion"></span>
  </div>

  <div class="field" id="canvasField">
    <label for="canvasUrl">画布地址（自动发现失败时填写）</label>
    <input type="text" id="canvasUrl" placeholder="http://127.0.0.1:5173" autocomplete="off" spellcheck="false">
  </div>

  <div class="actions">
    <button id="sendAllBtn" type="button" title="所有图层合并为一张 PNG 回传">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
      <span id="sendAllText">合并图层 → 画布</span>
    </button>
    <button id="sendLayerBtn" type="button" title="仅当前选中的图层回传">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l4-4 5 5"/><circle cx="14.5" cy="8.5" r="1.5"/></svg>
      <span>当前图层 → 画布</span>
    </button>
  </div>

  <div id="log"></div>

  <script src="js/csinterface-lite.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
