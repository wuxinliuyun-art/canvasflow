<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanvasFlow</title>
<link rel="stylesheet" href="screenshot-panel.css">
</head>
<body class="theme-light">
<div id="panel" class="panel">
  <div id="header" class="header">
    <div class="header-left">
      <span id="statusBadge" class="badge">运行中</span>
      <span id="areaBadge" class="area-badge hidden">区域已设</span>
    </div>
    <div class="header-actions">
      <button id="pinBtn" class="icon-btn active" title="取消置顶"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M5 9l4-4V2h6v3l4 4-3 3H8L5 9z"/></svg></button>
      <button id="collapseBtn" class="icon-btn" title="收纳面板"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
      <button id="closeBtn" class="icon-btn" title="关闭面板"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>

  <div id="compactBar" class="compact-bar">
    <span id="compactBadge" class="badge small">运行</span>
    <button id="compactCaptureBtn" class="btn primary icon-only" title="截图"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    <button id="compactSetAreaBtn" class="btn icon-only" title="设置区域"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg></button>
    <button id="compactGenerateBtn" class="btn accent icon-only" title="生成"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
    <button id="expandBtn" class="icon-btn" title="展开面板"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
  </div>

  <div id="expandedBody" class="expanded-body">
    <div class="toolbar">
      <button id="captureBtn" class="btn primary">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>截图</span>
      </button>
      <button id="setAreaBtn" class="btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <span>设置区域</span>
      </button>
      <button id="generateBtn" class="btn accent">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>生成</span>
      </button>
      <div id="areaStatus" class="area-inline">未设置区域</div>
    </div>

    <div class="section">
      <div class="section-head"><span class="section-title">AI 参数</span></div>
      <div class="params-grid">
        <label>模型<select id="modelSelect"><option value="gpt-image-2">GPT Image 2</option><option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash</option></select></label>
        <label>分辨率<select id="resolutionSelect"><option value="1k">1K</option><option value="2k">2K</option><option value="4k">4K</option></select></label>
        <label>画质<select id="qualitySelect"><option value="auto">auto</option><option value="low" selected>low</option><option value="medium">medium</option><option value="high">high</option></select></label>
        <label>比例<select id="sizeSelect"><option value="1:1">1:1</option><option value="auto">auto</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select></label>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">提示词</span>
        <button id="editPromptBtn" class="text-btn">编辑</button>
      </div>
      <div id="promptDisplay" class="prompt-preview">未设置提示词</div>
    </div>

    <div id="promptEditor" class="prompt-editor hidden">
      <div class="prompt-source-tabs">
        <button class="tab-btn active" data-source="custom">自定义</button>
        <button class="tab-btn" data-source="library">素材库</button>
      </div>
      <div id="customPromptPanel" class="source-panel">
        <textarea id="customPromptInput" rows="4" placeholder="输入固定提示词..."></textarea>
        <div class="prompt-actions">
          <button id="savePromptBtn" class="btn primary small">保存</button>
          <button id="cancelPromptBtn" class="btn small">取消</button>
        </div>
      </div>
      <div id="libraryPromptPanel" class="source-panel hidden">
        <div id="libraryPromptList" class="library-list"></div>
      </div>
    </div>

    <div id="statusBar" class="status-bar hidden">
      <span id="statusText"></span>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <div id="previewArea" class="preview-area hidden">
      <div class="preview-toolbar">
        <span id="previewTitle">截图预览</span>
        <button id="cancelPreviewBtn" class="text-btn">取消</button>
      </div>
      <div id="captureCanvas" class="capture-canvas">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="preview-actions">
        <button id="reCaptureBtn" class="btn small">重新截图</button>
        <button id="confirmCaptureBtn" class="btn accent small">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>确认</span>
        </button>
      </div>
    </div>

    <div id="resultArea" class="result-area hidden">
      <div class="result-toolbar">
        <span>生成结果</span>
        <div class="result-actions">
          <button id="saveResultBtn" class="icon-btn" title="保存"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          <button id="copyResultBtn" class="icon-btn" title="复制"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button id="deleteResultBtn" class="icon-btn" title="删除"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
      </div>
      <div id="resultList" class="result-list"></div>
    </div>

    <div class="footer-section">
      <div class="footer-status">
        <span>服务: <strong id="portText">--</strong></span>
        <span>版本: <strong id="versionText">--</strong></span>
      </div>
      <div id="logSection" class="log-section">
        <button id="toggleLogsBtn" class="text-btn">日志 ▾</button>
        <pre id="logOutput"></pre>
      </div>
      <div class="footer-actions">
        <button id="openCanvasBtn" class="btn small">复制画板地址</button>
        <button id="openExportBtn" class="btn small">导出文件夹</button>
        <button id="exitBtn" class="btn small">退出</button>
      </div>
    </div>
  </div>

  <div id="errorToast" class="error-toast hidden"></div>
</div>

<script src="screenshot-panel.js"></script>
</body>
</html>
